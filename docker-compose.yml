name: jadhr-quran-dev
services:
  db:
    image: postgres:17-alpine
    container_name: jadhr-quran-db
    environment:
      POSTGRES_USER: jadhr
      POSTGRES_PASSWORD: jadhr
      POSTGRES_DB: jadhr
    ports:
      - "5442:5432"
    volumes:
      - jadhr_quran_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jadhr -d jadhr"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  jadhr_quran_pg:
