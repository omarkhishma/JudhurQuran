[project]
name = "jadhr-api"
version = "0.1.0"
description = "Jadhr public API: Quran text, morphology, roots, lexica, tafsir — versioned, cited, read-only."
requires-python = ">=3.13,<3.14"
dependencies = [
  "jadhr-arabic",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "orjson>=3.10",
  "pyyaml>=6",
  "opensearch-py>=2.7",
  "cryptography>=43",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  # text intake (P11.3c): a web page's main text, a PDF's text layer, an upload — permissive licences only
  "trafilatura>=2.0",
  "pypdf>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jadhr_api"]
