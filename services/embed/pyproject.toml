[project]
name = "jadhr-embed"
version = "0.1.0"
description = "Jadhr's embedding service: an open model (MIT or Apache-2.0) run as ONNX on our own server, so no reader's query leaves it (D34)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=2.0",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jadhr_embed"]
