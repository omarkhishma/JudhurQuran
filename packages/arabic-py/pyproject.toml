[project]
name = "judhur-arabic"
version = "0.1.0"
description = "Arabic text utilities for the Judhur Quran platform: Buckwalter (Quranic Arabic Corpus variant), normalisation for matching, root helpers."
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judhur_arabic"]
