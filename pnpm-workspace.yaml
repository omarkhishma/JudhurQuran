packages:
  - apps/*
  - packages/*
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - unrs-resolver
onlyBuiltDependencies:
  - sharp
# Security floors for transitive tools (pnpm audit): vitest's vite and typescript-estree's minimatch
overrides:
  vite: ">=8.3.4 <9"
  minimatch@>=7.0.0 <11.0.1: ">=11.0.1 <12"
