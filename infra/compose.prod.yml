# Production stack: Postgres, API, web, Caddy (TLS + routing). Run from the repository root:
#   docker compose -f infra/compose.prod.yml --env-file .env.production up -d --build
# Load or update a dataset release (migrations + atomic load + web cache expiry):
#   docker compose -f infra/compose.prod.yml --env-file .env.production run --rm loader
# See docs/DEPLOY.md. Nothing here runs against production without the owner's go.
name: jadhr-quran

# every container's own log rotates; nothing here keeps a request log (Caddy's access log is filtered and kept 7 days)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: jadhr
      POSTGRES_DB: jadhr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jadhr -d jadhr"]
      interval: 5s
      timeout: 3s
      retries: 30

  search:
    # Derived index (rebuilt by the loader after every release); Postgres stays the source of truth.
    image: opensearchproject/opensearch:2.19.3
    restart: unless-stopped
    logging: *logging
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${SEARCH_HEAP:-1g} -Xmx${SEARCH_HEAP:-1g}
    volumes:
      - search:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: { context: .., dockerfile: services/api/Dockerfile }
    restart: unless-stopped
    logging: *logging
    # no capability and no way to gain one (security review I2)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { db: { condition: service_healthy }, search: { condition: service_healthy } }
    # alive and reading the dataset (P12): Caddy waits for it, and a restart follows a failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # its own role, made by the loader (python -m jadhr_api.dbroles): reads the content, writes the readers' schemas
      # and nothing else — never the superuser (security review L9)
      JADHR_DATABASE_URL: postgresql+psycopg://jadhr_api:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/jadhr
      JADHR_SEARCH_URL: http://search:9200
      JADHR_ENVIRONMENT: production
      JADHR_PUBLIC_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      JADHR_CORS_ORIGINS: '["${PUBLIC_URL}"]'
      JADHR_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      # Accounts (P6, docs/DEPLOY.md). Synced records are encrypted with DATA_KEY: required, and losing it loses
      # every synced record. Sign-in by e-mail stays off until MAIL_BACKEND=smtp with an SMTP host; Google and
      # Apple only when their credentials are set.
      JADHR_PUBLIC_WEB_URL: ${PUBLIC_URL}
      JADHR_DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -base64 32)}
      JADHR_MAIL_BACKEND: ${MAIL_BACKEND:-none}
      JADHR_MAIL_FROM: ${MAIL_FROM:-Jadhr <no-reply@localhost>}
      JADHR_SMTP_HOST: ${SMTP_HOST:-}
      JADHR_SMTP_PORT: ${SMTP_PORT:-587}
      JADHR_SMTP_USER: ${SMTP_USER:-}
      JADHR_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JADHR_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JADHR_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JADHR_APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      JADHR_APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      JADHR_APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      JADHR_APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Dataset releases (P10.1): served from the folder the release was built into, read-only; a file is served only
      # when its release is recorded and published and its bytes are those the manifest names (docs/DEPLOY.md)
      JADHR_RELEASE_DIR: /data/release
    volumes:
      - ../data/release:/data/release:ro

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        JADHR_API_ORIGIN: http://api:8000
    restart: unless-stopped
    logging: *logging
    # no capability and no way to gain one (security review I2)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      JADHR_API_ORIGIN: http://api:8000
      JADHR_REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      JADHR_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    # root in its image, but with no capability save binding ports below 1024, and no way to gain one (I2)
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: { web: { condition: service_healthy }, api: { condition: service_healthy } }
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # The account and contribution schemas, dumped daily and kept fourteen days exactly (what the privacy page states: a dump is
  # removed once it is 13 days and 23 hours old, before the next one is made). The content schema needs no backup:
  # it is rebuilt from data/build/<version>. Off-server copies keep the same fourteen days (docs/DEPLOY.md).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    # no capability and no way to gain one (security review I2)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      # read as the API's role, which reads these schemas, never as the superuser (security review L9)
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - account_backups:/backups
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        f=/backups/accounts-$$(date -u +%Y%m%dT%H%M).sql.gz;
        pg_dump -h db -U jadhr_api -d jadhr -n accounts -n contributions --no-owner | gzip > $$f.tmp && mv $$f.tmp $$f;
        find /backups -name 'accounts-*.sql.gz' -mmin +20100 -delete;
        sleep 86400;
        done

  # The site watched from outside (P12): every five minutes the smoke check of docs/DEPLOY.md against the public
  # address; what failed is counted in ops.errors (source "monitor", nothing about anyone) and, when ALERT_WEBHOOK
  # is set, posted to it. `python -m jadhr_api.ops errors` lists what went wrong.
  monitor:
    build: { context: .., dockerfile: services/api/Dockerfile }
    restart: unless-stopped
    logging: *logging
    # no capability and no way to gain one (security review I2)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { caddy: { condition: service_started } }
    environment:
      JADHR_DATABASE_URL: postgresql+psycopg://jadhr_api:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/jadhr
      JADHR_ENVIRONMENT: production
      JADHR_DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -base64 32)}
      JADHR_ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
    command: ["python", "-m", "jadhr_api.ops", "watch", "${PUBLIC_URL:?set PUBLIC_URL}"]

  # One-off, as the database's owner: apply migrations, make or update the API's role, load data/build/<version>,
  # expire the web cache.
  loader:
    profiles: [tools]
    build: { context: .., dockerfile: services/api/Dockerfile }
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: { db: { condition: service_healthy }, search: { condition: service_healthy } }
    environment:
      JADHR_DATABASE_URL: postgresql+psycopg://jadhr:${POSTGRES_PASSWORD}@db:5432/jadhr
      JADHR_SEARCH_URL: http://search:9200
      JADHR_WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      JADHR_REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # migrations that seal account data (0021) and the maintenance commands use the same key as the API
      JADHR_DATA_KEY: ${DATA_KEY:?set DATA_KEY (openssl rand -base64 32)}
      JADHR_ENVIRONMENT: production
      # recording a release reads its folder (python -m jadhr_api.releases record /data/release/<version>)
      JADHR_RELEASE_DIR: /data/release
      # the API's role is made or updated after the migrations, with this password (jadhr_api.dbroles)
      JADHR_APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - ../data/build:/data/build:ro
      - ../data/sources.yaml:/data/sources.yaml:ro
      - ../data/release:/data/release:ro
    command: ["sh", "-c", "alembic upgrade head && python -m jadhr_api.dbroles && python -m jadhr_api.loader /data/build/${DATASET_VERSION:?set DATASET_VERSION} /data/sources.yaml"]

volumes:
  pg:
  search:
  account_backups:
  caddy_data:
  caddy_config:
