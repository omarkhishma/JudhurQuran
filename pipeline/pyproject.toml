[project]
name = "jadhr-pipeline"
version = "0.1.0"
description = "Builds the canonical Jadhr Quran dataset from pinned, licensed sources: fetch → parse → validate → cross-check → load → release."
requires-python = ">=3.13,<3.14"
dependencies = [
  "jadhr-arabic",
  "httpx>=0.27",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
  "lxml>=5",
]

[project.optional-dependencies]
# audio analysis for refined word boundaries (jadhr_pipeline.recitation_refine); the build itself never needs it
audio = ["numpy>=2.1"]

[project.scripts]
jadhr-pipeline = "jadhr_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jadhr_pipeline"]
