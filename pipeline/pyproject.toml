[project]
name = "judhur-pipeline"
version = "0.1.0"
description = "Builds the canonical Judhur Quran dataset from pinned, licensed sources: fetch → parse → validate → cross-check → load → release."
requires-python = ">=3.13,<3.14"
dependencies = [
  "judhur-arabic",
  "httpx>=0.27",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
  "lxml>=5",
]

[project.scripts]
judhur-pipeline = "judhur_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judhur_pipeline"]
