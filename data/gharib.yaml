# Gharib registry — works that give a contextual Arabic meaning for the words of a verse, aligned to our word
# locations (PLAN P3.1, decision D6). Built by pipeline/src/jadhr_pipeline/meanings (``python -m
# jadhr_pipeline.meanings gharib <out>``) into the table gharib_meanings. The licence record for each work is
# in data/licences.yaml (same id); the terms evidence fetched for it is in data/raw/gharib-terms/.
#
# Every row the pipeline emits is status `extracted`: a mechanical reading of the named work, never a reviewed
# meaning. Meanings are the work's own words, verbatim (L2: no generated religious content); only the cleaning
# rules below touch the text, and each is counted in the build report. Paths are relative to data/raw/. Each
# file is sha256-pinned; the pipeline refuses to build from a file that differs.
#
# Ibn Qutaybah's Gharib al-Qur'an, the other gharib work we show, stays in data/lexica.yaml (gharib_glosses).

cleaning_rules:
  - id: verse-number
    description: "A verse paragraph opens with its number in brackets — «(2)», or «(1، 2)» / «(20،19)» for entries that span two verses. The number moves to `ayah` (the printed label to `ayah_label`) and is not part of any entry."
  - id: phrase-brackets
    description: "An entry is the Quranic phrase inside ﴿…﴾ followed by a colon and its meaning. `phrase_ar` is the text inside the brackets; `meaning_ar` the text after the colon, verbatim, ends trimmed. The brackets and the colon are not kept. Where no colon follows the bracket the meaning starts after the bracket (counted as phrase-brackets:no-colon)."
  - id: entries-on-one-line
    description: "Where two entries were typed on one line, a bracketed phrase followed by a colon starts a new entry — unless a colon stands right before the bracket («وقيل: ﴿بِهِۦ﴾: أي: باللهِ» explains a word of the same entry and stays in it)."
  - id: continuation-paragraph
    description: "A paragraph that opens with neither «سورة», a verse number nor ﴿ continues the previous entry's meaning (the typist broke the paragraph at a bracketed note, «خَمْراً» + «(وهذا امتنانٌ قبلَ التحريمِ) .»); it is joined to it with one space. Its further lines are entries of the same verse."
  - id: surah-heading
    description: "«سورة X» paragraphs open each of the 114 sūras in order; the name is checked against the dataset's sūra names and is not text of any entry."
  - id: empty-paragraph
    description: Empty paragraphs (one after each sūra) are skipped.

