# Knowledge-layer registry — the Quran side of the encyclopedia (PLAN P3.9).
# Every file the knowledge build reads is sha256-pinned here (paths relative to data/raw/); the build
# refuses a file whose hash drifted. Each source quotes its licence verbatim, names what we display
# (attribution in Arabic and English) and states how we may use it. Every output row carries the id
# of the source it comes from (`source_id` / `source_ids`), and that id must exist here.
# Texts are kept verbatim; the only transformations are the cleaning rules below, each counted in
# the build report.

cleaning_rules:
  - id: tc-apparatus-separated
    description: >-
      Tafsir Center fields print their editors' footnotes inline between ¬ and ¥ (sources, takhrīj,
      manuscript variants with sigla such as «ف، خ: …») and the edited counting works carry manuscript
      folio marks («/ 86 و/», «/ ظ 157/»; a folio mark always names the leaf side و or ظ). Both are taken
      out of the displayed text and kept, verbatim, in a notes list with the offset where each stood, so
      that the original field is rebuilt exactly (tested on every field). A space before a note is
      removed with it when punctuation follows. A note still open at the end of a field (the field was
      cut short at the source) runs to the end; a stray ¥ is kept as a marker item.
  - id: tc-narration-dedupe
    description: >-
      The Tafsir Center asbāb rows slice one compilation with overlaps: a narration printed again in the
      next row (same number, same text) is kept once, under its own verse heading when a copy has it.
  - id: openiti-markup
    description: >-
      OpenITI mARkdown is displayed as text: «# » paragraph marks become paragraph breaks, «~~» line
      continuations are joined with a space, PageVxxPyyy and msNNN tags are removed (and used for the
      locator), @QB@/@QE@ Quran-quote tags become ﴿ ﴾. Words are untouched.
  - id: derived-structure
    description: >-
      Verse keys, verse ranges, places, periods, counts and Wikidata ids are our own extraction from the
      cited text, each row stating the method and confidence that produced it. They are structure, not
      content: the quoted words always come with them.

