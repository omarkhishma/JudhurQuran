# Pattern catalog registry (PLAN P3.3) — what each morphological pattern (wazn) does, from named classical
# sarf works, verbatim, with locators. Module: pipeline/src/jadhr_pipeline/patterns_catalog/.
#
# Every row the pipeline emits is status `extracted`: a mechanical reading of the named work, never a
# reviewed function text (L2: no generated religious or linguistic content). Mapping a mention to our
# pattern slugs is mechanical and stores its method and confidence (patterns_catalog/mapping.py): the
# written letters within the chapter's word class; a vowel rule or class rule the chapter states, quoted
# below; the book's own example words read by two vowel oracles — the Quran (words.jsonl stems → their
# lemmas' patterns) and Lane's Lexicon (lexicon_entries.jsonl, used only to read vowels, never shown).
# What stays uncertain is left unmapped with its candidates. Editors review in the workbench (P3.0) and
# expert review follows (D15).
#
# Files are OpenITI release 2025.1.9 (tag v2025.1.9, commit below), fetched raw at that commit into
# data/raw/openiti-patterns/ (SHA256SUMS.txt and SOURCE.txt there). Paths are relative to data/raw/.
# Each file is sha256-pinned; the pipeline refuses to build from a file that differs.
#
# Licence: OpenITI publishes the corpus under CC BY-NC-SA 4.0 (decision D18: non-commercial display with
# attribution is approved for launch; anything redistributed from these rows stays CC BY-NC-SA 4.0). The
# authors are public domain (Ibn al-Ḥājib d. 646 AH, al-Raḍī d. 686 AH); the three files are OpenITI
# "cleaned" versions from which the editions' paratext (introductions, footnotes, indices) was removed; the
# extra cleaning rules below drop the footnote numbers and verse numbers the editors left in the text.

