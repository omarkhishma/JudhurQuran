# Rules applied to the raw files before parsing. The first eleven are relations/openiti.py's, unchanged (their
# ids and wording in data/relations.yaml); the last four (patterns_catalog/text.py) run only on the sources
# that list them in `extra_cleaning`. Every row's text is a slice of the cleaned file; the tests re-run the
# cleaning and check it.
cleaning_rules:
  - id: header-dropped
  - id: annotator-lines-dropped
  - id: auto-heading-inline
  - id: paragraphs
  - id: page-marks
  - id: milestones
  - id: line-marks
  - id: quote-markup
  - id: stray-marks
  - id: folio-marks
  - id: whitespace
  - id: auto-headings
    description: "al-Kāfiya's typing marks the editor's section titles «### | AUTO [المصدر]», each followed by a line holding only «# :». They are headings, not inline words: the line becomes «### | [المصدر]» (the brackets, which mark the title as the editor's, are kept) and the lone colon line is dropped."
  - id: footnote-refs
    description: "The editors' footnote numbers left in the running text after OpenITI removed the footnotes: «(1)», «(¬1)»."
  - id: shahid-numbers
    description: "The editors' running numbers before quoted verses in al-Raḍī's edition («قال الفرزدق: - 13 - ما زلت …»)."
  - id: hemistich-marks
    description: "OpenITI's «%» hemistich separator in quoted verse."

