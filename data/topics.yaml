# Topic sources (PLAN P8.3, research 06 Part 3, decision D29). A topic is a heading a source gives with the verses it
# gathers under it; each verse–topic link carries its source and the source's version. Nothing here is ours: the
# editorial taxonomy (La Beaume's public-domain top level merged with Quranpedia's roots) is the editorial board's to
# build in the workbench, from these.
#
# - Quranpedia's Arabic topic tree: human-made, hierarchical (four levels), credited with its version on every
#   answer that carries it (D29: our API republishes it in part). Shown to readers, said to be Quranpedia's.
# - QSAC: English, labelled with a language model, every verse covered; only editor-side candidates (D29, L2) —
#   `shown: false`. Its verse text and English translation columns are never read (L1; the translation is not ours
#   to republish).
# - La Beaume's Le Koran analysé (1878, public domain): its table of contents only — the 18 chapters the board may
#   adopt as the taxonomy's top level, each under an Arabic name of the board's (P8.3b) — `shown: false`. The verses
#   under each chapter are not imported: the text is OCR and its verse numbers differ from Hafs (research 06).
#
# Each file is sha256-pinned; the build refuses a file that differs. Paths are relative to data/raw/.

