# Transformations applied to every file before parsing (pipeline/src/jadhr_pipeline/relations/openiti.py).
# Every row's text is a slice of the cleaned file; the tests re-run the cleaning and check it.
cleaning_rules:
  - id: header-dropped
    description: "The OpenITI metadata header (up to #META#Header#End#) is not text."
  - id: annotator-lines-dropped
    description: OpenITI working notes on their own line («### | CHECK [13-89]») are dropped.
  - id: auto-heading-inline
    description: "«### | AUTO X» lines — a bold headword the conversion lifted out of the running text (Ibn al-Anbārī) — are put back inline where they stood: glued to a one-letter proclitic before them and to a next line that continues the word («الفلذ» + «ة: قطعة» → «الفلذة: قطعة»)."
  - id: paragraphs
    description: "«# » opens a paragraph, «~~» continues it (joined with one space); heading lines («# |», «### |») are paragraphs of their own; a line holding only a page or milestone marker stays in the paragraph it interrupts."
  - id: page-marks
    description: PageVxxPyyy is removed and kept as the locator (the marker closes printed page yyy).
  - id: milestones
    description: msNNN is removed and kept as a locator, cited only with the release (OpenITI regenerates milestones).
  - id: line-marks
    description: «|», the typist's printed-line breaks and heading bars, is removed.
  - id: quote-markup
    description: "OpenITI Quran-quote tags @QB@ … @QE@ and ^ are removed; their spans (and ^ ( … ) ^ pairs) are kept for verse resolution."
  - id: stray-marks
    description: «$» and «@» left over from the conversion are removed.
  - id: folio-marks
    description: The modern editor's manuscript folio marks «( 52 / أ )» are removed (decision D22).
  - id: whitespace
    description: "Runs of spaces collapse to one; paragraphs are trimmed and empty ones dropped; no space before ، ؛ : . ؟ ! ) ] or after ( [. Whitespace only."
  - id: footnote-refs
    description: "Opt-in per source (footnote_refs: true): the edition's footnote numbers left glued to the word they annotate («دب1 على», «طروقة4 فحلها») are removed — the footnotes themselves were removed by OpenITI's Clean operation, so the numbers point at nothing. Only one to three ASCII digits right after an Arabic letter or mark and before a space, punctuation or the end."

