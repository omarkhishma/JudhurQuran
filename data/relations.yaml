# Relation seed registry — classical works parsed into relation candidates (PLAN P8.4) and wujūh senses
# (P3.1), shown to readers in the Meanings section as extracted and not yet reviewed, with full credit. Research and licensing: docs/research/06-knowledge-sources.md Part 1 and Part 8.
#
# Every row the pipeline emits is status `extracted`: a mechanical reading of the named work, never a
# reviewed relation; the reader is told so. Editors review in the workbench (L2: no generated religious or linguistic content —
# every relation comes from a named classical work, with its locator and the author's words).
#
# Files are OpenITI release 2025.1.9 (tag v2025.1.9, commit below), fetched raw at that commit into
# data/raw/openiti-relations/ (SHA256SUMS.txt and SOURCE.txt there). Paths are relative to data/raw/.
# Each file is sha256-pinned; the pipeline refuses to build from a file that differs.
#
# Licence: OpenITI publishes the corpus under CC BY-NC-SA 4.0 (decision D18: non-commercial display with
# attribution is approved for launch; anything redistributed from these rows stays CC BY-NC-SA 4.0). The
# authors are public domain; the editions' apparatus is not used (the OpenITI cleaned versions drop it, and
# the cleaning rules below drop the folio marks that remain).

