  our_use: 'Shown to readers: al-Wāḥidī (d. 468 AH)''s Asbāb nuzūl al-Qurʾān in full, cut into 454 sections keyed to verse ranges (pipeline/src/jadhr_pipeline/knowledge/asbab.py, asbab rows of work wahidi), OpenITI markup rendered as text and the words untouched; served in GET /api/v1/verses/{key}/knowledge (asbab) and listed after the Tafsir Center''s narrations in the verse view''s ''Occasions of revelation'' layer, each item labelled with the work and credited ''al-Wāḥidī, Asbāb nuzūl al-Qurʾān, ed. ʿIṣām al-Ḥumaydān (Dār al-Iṣlāḥ, 1412 AH). Digital text: OpenITI corpus release 2025.1.9, CC BY-NC-SA 4.0''. Not in the bulk release.'
