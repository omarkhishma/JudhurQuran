  our_use: 'Shown to readers: Ibn al-Jawzī (d. 597 AH)''s Nuzhat al-aʿyun parsed into 321 wujūh entries with 1,659 numbered senses, each row a verbatim slice of the cleaned OpenITI text with printed page and milestone, Quran quotations resolved to verses and headwords mapped to roots mechanically, status extracted (pipeline/src/jadhr_pipeline/relations; tables relation_entries, relation_candidates, relation_citations). Served by GET /api/v1/words/{slug}/relations with the source''s attribution, licence and licence URL, and shown in every word entry''s Meanings section (WujuhBlock) as the senses of the word, the one whose verses include this occurrence marked, credited on screen by author, death date, title and page. Not in the bulk release (release.py EXCLUDED names the wujūh and furūq works).'
  status: attention
  notes:
  - 'Terms read 2026-10-03 and unchanged: the OpenITI documentation page (41c356b2…), the Zenodo record for release 2025.1.9 (licence id cc-by-nc-sa-4.0, 035026a6…) and the CC BY-NC-SA 4.0 legal code (527c4e0e…) are byte-identical to what the pattern and particle entries recorded; the pinned file (64037e51…) equals today''s download at commit cfc4157a.'
  - The author died 597 AH / 1201 CE (public domain). The edition is al-Rāḍī's (Muʾassasat al-Risāla, Beirut, 1404/1984); OpenITI flags the file PRIMARY_VERSION, CLEANED_VERSION with the paratext removed, and our cleaning rules (relations.yaml) remove only markup and the editor's folio marks.
  - 'Not met: the screen credit (Wujuh.tsx SourceLine) gives only author, death date, title and page. CC BY-NC-SA 4.0 asks for the credit, the licence with its link and a note of our changes, and OpenITI asks that the file or corpus be cited; relations.yaml attribution_ar/en carries all of that and the API returns it with licence_url, but no page shows it.'
  - 'Our records describe these rows as editor-side (relations.yaml header: ''editor-side relation candidates … Editors review in the workbench''), yet every reader sees them, under the note ''Extracted automatically from the source''s own text; not yet reviewed by an editor.'''
  - Display is what D18 approved (non-commercial, with attribution); the API's answers carry the licence, so anything shared from these rows stays CC BY-NC-SA 4.0 (ShareAlike) and out of a commercial launch (D2).
