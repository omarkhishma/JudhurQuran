  our_use: 'Editor-side loanword rows (PLAN P3.7a, registry data/loanwords.yaml, module pipeline/src/jadhr_pipeline/loanwords/): al-Suyūṭī (d. 911 AH)''s al-Muhadhdhab parsed from OpenITI''s primary version JK009264 into its introduction (29 passages: the dispute over non-Arabic words in the Quran, each view with the names the text gives), its 125 entries verbatim with printed page and milestone and the languages each names, and 122 mechanical links from headwords to Quran lemmas (or to the sūra-opening letters); the two cross-check versions (ShamAY0034093, Shamela0026097) are read only to compare letters, pages and blocks; status extracted. Not yet built into the dataset, the API or the UI (integration pending); when shown, with the attribution data/loanwords.yaml attribution_ar/en (work, edition, OpenITI release and file, CC BY-NC-SA 4.0) and the introduction''s disagreement beside any loanword claim; not in the bulk release.'
  status: ok
  notes:
  - 'Terms as read 2026-10-03 for the particle entries (mughni, jana-dani): the OpenITI documentation page (41c356b2…) and the CC BY-NC-SA 4.0 legal code (527c4e0e…) were not re-fetched for this entry (the session had no network); the next licence_check run re-reads their quotes. The Zenodo record was re-read from the pinned copy data/raw/openiti-2025.1.9/zenodo-record-17767721.json (same sha256, 035026a6…), and the four files from data/raw/openiti-loanwords (fetched 2026-10-03 at tag v2025.1.9 = commit cfc4157a, sha256 as SHA256SUMS.txt there).'
  - 'Met by today''s use under D18: non-commercial, attributed (the attribution names the release, the file and the licence), editor-side; when rows reach readers or a bulk file, anything shared from them stays CC BY-NC-SA 4.0 (ShareAlike) and stays out of a commercial launch (D2).'
  - 'The author is public domain (d. 911 AH / 1505 CE). The edition is Samīr Ḥusayn Ḥalabī''s (Dār al-Kutub al-ʿIlmiyya, Beirut, 1st ed., 1408/1988), named by the primary file''s card and by ShamAY0034093''s; OpenITI''s cleaned version drops the edition''s paratext. Two editorial headings and the editor''s lead-in to the Baghdad manuscript''s colophon remain in the text and are marked as such on their rows.'
  - 'Printed pages rest on Shamela''s statement «[ترقيم الشاملة موافق للمطبوع]» on ShamAY0034093 (JK009264''s page markers are its markers, letter for letter); they were not checked against shamela.ws book 34093 here (no network) — to do when the licence pages are next re-read.'
  - 'Shamela0026097 names another edition (al-Tihāmī al-Rājī al-Hāshimī, Maṭbaʿat Faḍāla); it is pinned as evidence only, no text from it is used.'
