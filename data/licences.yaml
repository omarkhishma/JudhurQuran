# Licence register — what every source the product uses says about its terms today, quoted verbatim,
# set against what the product does with it. Re-checked before every release (PLAN P1.8): re-fetch every
# URL in urls_checked, compare page_sha256, re-read the clauses, update `fetched`, and put any change in
# front of the owner. The summary and the owner's decisions are in docs/research/07-licence-register.md.
#
# One entry per id in data/sources.yaml, data/lexica.yaml, data/gharib.yaml, data/works.yaml,
# data/recitations.yaml (its reciter ids), data/patterns.yaml, data/particles.yaml, data/loanwords.yaml,
# data/relations.yaml and data/knowledge.yaml (its evaluation-only sources included), plus `everyayah` and
# `quran-align`, the two upstreams recitations.yaml names in audio_url and timings_zip.
#
# Fields
#   urls_checked    every page, file or API answer read for this entry (pinned commits where a repo has one)
#   fetched         date of the fetch run (UTC+3; the run itself was 2026-10-02 22:22–22:43 UTC)
#   page_sha256     sha256 of the exact bytes each URL returned (MP3s: the first 16 KiB, read by HTTP range)
#   fetch_failures  URLs that did not answer, and the Wayback capture used instead (latest 200 capture)
#   clauses         {topic, quote, url}; topic is display | attribution | modification | redistribution |
#                   commercial | retention | other. Quotes are verbatim in their original language; only
#                   whitespace is normalised (line breaks and runs of spaces become one space), and the '#'
#                   or '*' comment marker at the start of a file-header line is not part of a quote. Quotes from
#                   inside binary files come from the font's name table (TTF) or the MP3's ID3 frames.
#   our_use         what the product does with the source today (registry entry, research, code)
#   status          ok        — terms read, unchanged in substance, and met by today's use
#                   attention — met only in part, or a use the terms do not address, or a change since our
#                               records: needs an owner decision or action
#                   conflict  — the source's own statements contradict each other, or contradict our records,
#                               on a point today's use depends on
#   notes           one line each, plain English

