  status: attention
  notes:
  - 'Terms read 2026-10-04: the documentation page (41c356b2…) and the CC BY-NC-SA 4.0 legal code (527c4e0e…) are byte-identical to what the other OpenITI entries recorded; the Zenodo answer differs from the copy pinned in data/raw/openiti-2025.1.9 only in its view and download counters, the licence id unchanged; the seven version cards equal the copies saved in data/raw/openiti-2025.1.9-hadith.'
  - The authors died 179–303 AH (public domain). OpenITI does not record per title whether a kitāb or bāb title is the author's or a later editor's, so the screen credits the titles to the OpenITI version and its edition, never to the author (P11.2c).
  - The al-Tirmidhī version was cleaned from a typing of al-Albānī's Ṣaḥīḥ wa-ḍaʿīf Sunan al-Tirmidhī with its paratext removed; we read its titles only. The Abū Dāwūd and Ibn Mājah cards are OpenITI's unfilled template, so their printed edition is unstated.
  - 'CC BY-NC-SA 4.0: non-commercial display with attribution is approved (D18); rows served through the API stay CC BY-NC-SA 4.0 (ShareAlike); a commercial path needs titles from a public-domain printing or another licensed source (D2, research 21: Arabic Wikisource or MIS).'
