  our_use: Contextual Arabic meaning per Quranic phrase (P3.1, D6) — 11,384 entries parsed from the Complex's own Word file, each aligned to our word locations (gharib_meanings, status extracted), to be shown verbatim with the attribution line of data/gharib.yaml in the reader's Meanings section and served for display one verse at a time; not redistributable, excluded from the bulk release.
  status: attention
  notes:
  - The KFGQPC hosts time out from here; the developer platform was read from its latest Wayback captures (quran-dev 2026-01-22; the older techquran/dev 2025-09-01), and both carry the same statement for this item.
  - 'The statement is item-specific: the Complex offers this data to developers, researchers and publishers for use in the content of their applications — desktop, mobile and browsers — and in research. A website showing it with credit is that use. It names no conditions and no credit requirement; we credit anyway.'
  - The statement says nothing about redistribution, a public API, bulk download or commercial use, and the site reserves all rights; so the work is display-only (redistributable false), out of the bulk release, and API exposure beyond what the reader displays needs the Complex's confirmation (D19, with the qpc-hafs question).
  - 'Version: the platform gives no number — created 6-4-2021, last modified 6-4-2021, ''no updates'' (2026-01-22 capture). The MD5/SHA-1 it publishes do not match the served file; our file equals the 2025-04-17 Wayback copy and the independent byte-for-byte mirror quran-ws/kfgqpc-resources (sha256 8a7af5de…, served with Last-Modified 2023-01-12), whose own record notes the same mismatch. Ask the Complex which file the checksums belong to (D19).'
  - 'Other places the text is published, none with better terms: QUL resource 519 (a variant recension; ''We don’t have copyright information for this resource.''); Quranpedia (page images of the printed book only; its data licence leaves contemporary works with their publishers, and its per-verse meanings dataset does not carry this book — for 2:15 it gives al-Siraj, Ibn al-Haim, Ibn al-Jawzi and Makhlouf); quran-uni.com (page images, all rights reserved); QuranEnc does not publish it (its only Arabic word-meaning work is al-Siraj).'
