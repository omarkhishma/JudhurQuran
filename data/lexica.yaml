# Lexicon registry — classical dictionaries and Quran-gharib works served per root / per verse.
# Research and licensing: docs/research/02-arabic-lexica.md.
# Every file is sha256-pinned; the pipeline refuses to build from a file that differs.
# Paths are relative to data/raw/.
# Texts are imported verbatim. The ONLY transformations allowed are the cleaning rules listed
# under `cleaning_rules`; each one is counted per work in the build report.

cleaning_rules:
  - id: front-matter-skipped
    description: "Editor introductions, studies, indexes and section-only text (كتاب/باب/فصل headings and the prose under them) are not imported; only dictionary articles / gloss items are. In al-ʿAyn and Tahdhīb this includes the remarks between a group title and its first article and al-Azharī's closing chapters on the letters (باب الألفات، الياآت، الواوات، الهمز), which are grammar, not root articles (`front-matter-skipped:chars` counts every character left out)."
  - id: footnotes-dropped
    description: The Shamela page `footnotes` field (the modern editor's apparatus — takhrij, variant notes, commentary) is never imported.
  - id: footnote-markers-removed
    description: "Editor footnote reference markers in the body are removed — «١» (al-Mufradat, Lisan, al-ʿAyn), (¬١) (Maqayis), (١) (al-Sihah, Ibn Qutaybah, Tahdhīb — where (١) follows a sūra name it is the verse number and stays, `:verse-number-kept`). The report counts how many had a matching note on the same page. In al-ʿAyn the typist sometimes broke the line between a marker and the full stop after it («… وتَعَظْعَظْ «٢»» / «. أي اتَّعْظْ…»); with the marker gone, that stop goes back to the end of the line it closes when that line has none of its own (`:stop-after-marker-rejoined`); no character is dropped."
  - id: title-markup-removed
    description: "Shamela heading markup <span data-type=\"title\" …>…</span> is removed from the body; the heading text becomes the entry headword (or the surah for gharib items). Where the typist broke a heading span over two lines (Tāj, two headings), the break inside the span becomes a space so the heading is still recognised (`title-markup-removed:line-break-inside-heading`)."
  - id: page-join
    description: Consecutive printed pages are joined. A page that ends a line starts a new paragraph; a page that breaks mid-paragraph is joined with a single space. Whitespace only.
  - id: whitespace-normalised
    description: "Line breaks become paragraph breaks (\\n\\n); runs of spaces/tabs collapse to one space; paragraphs are trimmed; empty paragraphs dropped. In Tāj, an empty bracket pair left by a lost honorific glyph and split over two lines («[⏎]») is put back on one line (`whitespace-normalised:line-break-in-empty-brackets`)."
  - id: separator-lines-dropped
    description: Decorative separator lines ("* * *") between gloss groups are dropped (Ibn Qutaybah).
  - id: gharib-item-number
    description: Ibn Qutaybah items open with the ayah number(s) and a dash — «٤١-», «٣٠ و٣١-», «١٦، ١٨، ٢١، ٣٠-», «١٧-١٨-». The number prefix is moved to `ayah` and is not part of the gloss; the gloss is the item's printed text after it, verbatim, including any connective and the quoted phrase («و ﴿يَوْمِ الدِّينِ﴾ يوم القيامة…»). `phrase` repeats the first quoted words (﴿…﴾, (…) or "…") for alignment. An item naming several ayahs gives one gloss row per listed ayah in which its phrase occurs (same text); a phrase quoted across ayahs ("… * …") is aligned part by part. A line with no number that opens with ﴿…﴾ is a further item of the same ayah, unless its phrase is absent from that ayah (±3) but present elsewhere in the Quran — then it is a cited verse and stays, verbatim, in the previous gloss.
  - id: lisan-article-split
    description: Lisan al-Arab is split into articles at line-initial headwords "X:" whose first letter matches the current فصل and whose last letter matches the section's باب (majority of headwords in that فصل; weak/hamza bab accepts و ي ا ى ء). Splitting only inserts boundaries; no text is moved or changed.
  - id: taj-article-split
    description: "Tāj al-ʿArūs is split at printed root headings taken in the order of its TOC: a heading span that opens its line (only marks, digits or punctuation such as «٣ -» before it — dropped with the heading), or a plain line that is only the heading (where the typist misplaced the anchor). A TOC anchor inside running text or glued into a word is ignored and its text kept. Two headings over one text («ظوأ» then «وظيأ») make one article with both headings. A root article the TOC does not list, typed «صرخَ: (الصَّرْخَة…» at a line start, is split when the word shares the article's first and last radical and sorts between the neighbouring headings (17 such). Section headings (باب، فصل، الجزء، المقصد، رموز…) close the article. Splitting only inserts boundaries; no text is moved or changed."
  - id: heading-separator-dropped
    description: "What the typing printed around a root heading goes with the heading, which becomes `headword`: the colon or full stop after it («أبأ» then «: ( الأَبَاءَةُ…», «ع ز ر» then «. العَزْرُ…»), the brackets of a bracketed heading («(⏎قبعر⏎)», «[دغمس⏎]») and stray numbering or punctuation on the heading's own line before it («٣ - (ف ط ر)»)."
  - id: taj-headword-markers-removed
    description: "The Shamela typing of Tāj turned the sign printed before each headword into ﴿, ﴾ or ! (alternating, 3–22 per 1,000 letters). These marker characters are removed with the space the conversion put beside them. Quran quotations use the same brackets, so a ﴿…﴾ span is kept when it reads as a quotation: a sūra:āya reference follows it; or a citation introduces it (تعالى، عز وجل، جل ثناؤه، التنزيل، قرئ… ending in a colon or after a verb of citing, with no full stop between — not the eulogy «إلى الله تعالى.»), and a cited span cut through al-Qāmūs's parentheses must still read as Quran; or its words alone follow the Quran (60% or more of its consecutive word pairs occur in one verse) with no parenthesis, square bracket or lexicographer's colon inside. Spans are chosen together without overlaps, so a marker inside a quotation is still removed. Counted per reason (`taj-quotation-brackets-kept:*`)."
  - id: qamus-bullet-split
    description: "al-Qāmūs (Risāla edition) opens every root with a bullet «•» and never prints the root. Every bullet starts an article that runs to the next bullet or section heading; the bullet is the edition's article mark and is not kept. Where the typist left out a bullet (18 lines such as «الشَّجَرُ والشِّجَرُ…» or «حارَ يحَارُ حَيْرَةً…» inside the previous article), the article starts at the line whose first word carries the letters of a Tāj root left unpaired in that section and whose opening words open that Tāj article, which quotes al-Qāmūs. The headword is the article's first word as printed (after «و:» or «ي:», the weak-letter mark of باب الواو والياء, which stays in the body). Splitting only inserts boundaries; no text is moved or changed."
  - id: qamus-root-alignment
    description: "Each al-Qāmūs article is aligned to the Tāj al-ʿArūs root headings of the same باب (last radical) and فصل (first radical) — Tāj is a commentary that follows al-Qāmūs article by article — by an order-preserving alignment scoring (a) the Tāj root's letters appearing in order in the headword (a weak radical may be written و، ي or ا) and (b) the article's opening words appearing at the opening of Tāj's article, which quotes al-Qāmūs. A section whose فصل heading the typing lost is aligned against the Tāj roots up to the next فصل present; a leftover article takes an unused root of its section when letters and text both agree (Tāj sometimes orders two roots the other way round). The aligned Tāj heading is used only to map the root; nothing is displayed from Tāj. Unaligned articles are listed in the report and mapped from their own headword; the closing section on particles is not aligned."
  - id: taqalib-article-split
    description: "Kitāb al-ʿAyn and Tahdhīb al-Lugha file every root under a group of letters and treat all its permutations there. A group starts at its title — a TOC heading, or a line the typist did not tag: spaced letters «ق ص د» or «ح ص ن حصن، حنص…: مستعملة.», «(باب الزاي والراء)», «كتاب الحروف الجوف» — which gives the group's letters and its «مستعمل/مهمل» lists; Tahdhīb repeats the list on a line of its own («عقش، عشق…: مستعملة.», «نزر. رزن… (مستعملة)», «استعمل من وجوهه: (طسوج)»); «أهمله الليث» (al-Layth left it out) is not «مهمل». al-ʿAyn's section titles (الثنائي، الثلاثي، المعتل، اللفيف، الرباعي، الخماسي) give the number of radicals; Tahdhīb rarely names them, so each group's own letters decide. A TOC title that is neither (a poem line, «﷽») stays in the text. An article starts at a line opening with its permutation header («هقع:», «عق، قع:», «(سخن) :», «خول _ خيل:», «الحرقوص:») when the header is in the group's list or its letters fit the group (a written hamza is a radical, a long vowel is not); other line-initial «word:» — «قال:», «الليث:», glosses («والخؤولة:», «الخلابيس:»), a word of a root that already has its article («الدعموص:» after «دعمص:») — stay in the text. Tahdhīb also files quadriliterals and weak roots where its typing gives no title («ثرمل» after the لفيف of ث, «ليل: الليث:» and «وقي:» after ل م and ق م); there the section's first letter suffices. A colophon closing a letter («تم حرف السين…», «آخر كتاب الراء») ends the article and is not imported (`:colophon`). A list line directly followed by text heads the article of its first permutation (`:list-line-opens-article`). 65 pages of Tahdhīb vol. 4 were typed without line breaks; they are cut back into lines before headers, group titles and spaced letters that follow a sentence end (`:flat-page-cut`, `:header-inside-a-flat-page`); a piece that is not a header rejoins its line with a space. The article runs to the next header or group; the body keeps its printed header, as Lisān's do. The report lists the listed permutations never found as a header (the «مستعمل» lists are the checklist). Splitting only inserts boundaries; no text is moved or changed."
  - id: editor-supplements
    description: "An edition that marks its editors' supplements with square brackets (al-ʿAyn: «[…]», words «required by the context» or restored from another manuscript or book) states per work how they are shown (`editor_supplements`): keep — as printed, brackets and all, so the reader sees they are the editors'; unwrap — the words without the brackets; drop — removed. al-ʿAyn keeps them (DECISIONS 2026-10-03), so this rule is counted only for a work set to unwrap or drop."
  - id: lane-markup-removed
    description: Lane (Perseus TEI) markup is removed; element text is kept in document order; each <entryFree> becomes one paragraph; <pb n> page breaks become page_ref only.
  - id: lane-transliteration
    description: Lane's Arabic is encoded by Perseus in a Buckwalter variant; it is converted to Arabic script with the Perseus/laneslexicon table (A^→أ, A_→إ, A@→ٱ, y^→ئ, w^→ؤ, then standard Buckwalter incl. `→ٰ, {→ٱ, ^→ٔ, =→ٓ, _→ٕ, -→ـ). Characters outside the table are kept and counted.

