# Loanword registry — al-Suyūṭī's «المهذب فيما وقع في القرآن من المعرب», parsed into editor-side rows (PLAN
# P3.7a): the introduction's dispute over whether the Quran holds words that are not Arabic (every view with the
# name the text gives), one entry per word of his list in the book's order under its letter chapter, verbatim,
# with its printed page and milestone, the languages its text names (each with the words that name it), and a
# mechanical link from the headword to the Quran's lemmas.
#
# Every row the pipeline emits is status `extracted`: a mechanical reading of the named work, never a
# reviewed row (L2: no generated religious content — every claim is the author's words, with the work,
# edition, page and milestone behind it; nothing is paraphrased, translated or summarised). The UI shows a
# loanword claim only with the introduction's disagreement beside it, each view with its holders as the text
# names them. Mapping a headword to a lemma is mechanical, the method stored on every link; where it is not
# certain, nothing is linked and the candidates are kept with the reason.
#
# Files are OpenITI release 2025.1.9 (tag v2025.1.9, commit below) — the release data/particles.yaml and
# data/relations.yaml pin — fetched raw at that tag into data/raw/openiti-loanwords/ (SOURCE.txt and
# SHA256SUMS.txt there). Paths are relative to data/raw/. Each file is sha256-pinned; the pipeline refuses to
# build from a file that differs.
#
# Licence: OpenITI publishes the corpus under CC BY-NC-SA 4.0 (decision D18: non-commercial display with
# attribution is approved for launch; anything redistributed from these rows stays CC BY-NC-SA 4.0). The
# author is public domain (d. 911 AH); the edition's apparatus (introduction, footnotes) is not in OpenITI's
# cleaned version. Licence evidence: data/licences.yaml entry `muhadhdhab`.

openiti:
  release: "2025.1.9"
  tag: v2025.1.9
  commit: cfc4157a3cf2054c0888f133970a4eaa3e22e58c
  repository: https://github.com/OpenITI/RELEASE
  zenodo: https://zenodo.org/records/17767721
  doi: 10.5281/zenodo.17767721
  licence: CC BY-NC-SA 4.0
  licence_url: https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode
