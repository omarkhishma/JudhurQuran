# Transformations applied to the file before parsing: the cleaner the relation seeds and particle works use
# (pipeline/src/jadhr_pipeline/relations/openiti.py; the rules and ids of data/relations.yaml → cleaning_rules),
# after two opt-in rules of this source (pipeline/src/jadhr_pipeline/loanwords/text.py). Every row's text is a
# slice of the cleaned file; the tests re-run the cleaning and check it.
cleaning_rules:
  - id: header-dropped
  - id: annotator-lines-dropped
  - id: auto-heading-inline
  - id: paragraphs
  - id: page-marks
  - id: milestones
  - id: line-marks
  - id: quote-markup
  - id: stray-marks
  - id: folio-marks
  - id: whitespace
  - id: pipe-paragraphs
    description: "In this typing a «|» inside the running text marks where a paragraph of the Shamela typing it was converted from ended (its 225 bars stand where ShamAY0034093 opens a new «#» line). The shared cleaner removes bars as printed-line marks, which would run each letter chapter into one paragraph; here a bar inside a line becomes a paragraph break. Heading bars («# |») are left to the cleaner. Whitespace only."
  - id: name-marks
    description: "The pages the Shamela typist typed afresh put a straight apostrophe around names («قال ' ابن مردويه ' حدثنا ' أحمد …»), a conversion residue like the «$» and «@» the shared cleaner drops: the 116 apostrophes (pages 67–79, 82 and 118) are removed and counted."

# How a headword is linked to the Quran (pipeline/src/jadhr_pipeline/loanwords/linking.py). Mechanical only;
# method, spelling level, confidence and scope are stored on every link.
mapping_rules:
  - id: quoted-phrase
    description: "The entry quotes the Quran around the headword («يا أرض ابلعي ماءك», «وإذ قال إبراهيم لأبيه آزر», «لا وزر»): a run of two or more of the entry's words, five letters at least, that stands word for word (after the project's normalisation) in one sūra and aligns one of its words with a Quran word written as the headword. The aligned words are the occurrences; one lemma among them → linked at those occurrences (scope occurrence). Runs that point to different lemmas link nothing."
  - id: word-form
    description: "Quran words written as the headword once their proclitics (و ف ب ك ل س, the interrogative أ) are set aside, endings kept, a tanwīn alif optional («هونا» is «هون»); only when no such word exists, the same words with their attached pronouns and subject endings set aside too («فومها» → «فوم»), mushaf and imlāʾī spellings both."
  - id: lemma-form
    description: "Lemmas whose dictionary spelling is the headword (the mushaf's dagger alif also read as a written alif: صِرَٰط → صراط). Used when no word keeps the headword's endings; a link is of scope lemma when the headword is the lemma's own spelling, else of scope form with the occurrences of that form."
  - id: article
    description: "A headword with the article «ال» matches only Quran words that carry it, and only noun, adjective and proper-noun lemmas (a verb takes no article): «المهل» is not the verb «مهل»."
  - id: initials-form
    description: "A headword written as a sūra's opening letters («طه», «يس», «ن») is linked to those words; the corpus gives them no lemma (kind initials). A one-letter headword is matched only exactly and only to such letters."
  - id: spelling-levels
    description: "Spelling is compared at four levels and the strictest that finds anything decides: exact (marks removed, hamza seats kept, a final yā' with or without its dots), initial-alif (the typist's unmarked initial alif meets أ/إ/آ: «استبرق» = «إستبرق»), hamza-seat (the seat a hamza sits on and a tanwīn alif after it are conventions: «متكئا» = «متكأ»), normalised (the project's matching normalisation: «منساة» = «منسأة»). Confidence: exact, high, high, medium."
  - id: one-lemma
    description: "Several lemmas of one spelling (أَب father and أَبّ pasture for «أب»; بَيْع and بِيَع for «بيع») link nothing unless a quoted phrase decides: they stay as candidates with the reason. Proper names are linked like any word."
  - id: several-words
    description: "A heading of several words («الأولى والآخرة», «هيت لك») is linked word by word, a «و» before a later word set aside; a word whose only lemma is a function word (the preposition with its pronoun in «هيت لك») is not linked and the entry says so."
  - id: candidates
    description: "When nothing is linked, the entry keeps candidates for editors: the lemmas that share the spelling or the quoted phrases' lemmas, or — when nothing shares the spelling — lemmas of the same consonant skeleton or whose root letters are the headword's letters («قفل» → «أَقْفَال»), each with how it was found."

# The languages an entry names, found by words in its text (after the heading). Each form is a word or a run of
# words as this typing writes them, matched word for word (punctuation between words ignored); the match keeps
# its span. name_ar / name_en are the UI's labels for the language, not the author's words — the author's words
# are the matched span. «الفارسي» alone is not a form: in this book it is only the nisba of Abū ʿAlī al-Fārisī
# («قال أبو علي الفارسي»). slip_forms are typing slips read as that language, each with its evidence.
# Groups foreign, region and arabic-dialect name a language (an entry's language_keys); unnamed («بلغتهم») and
# marker («معرب»، «أعجمي»: said to be non-Arabic, no language named) are kept on the entry but name none.
languages:
  - key: persian
    group: foreign
    name_ar: الفارسية
    name_en: Persian
    forms: [فارسي, فارسية, الفارسية, بالفارسية, فارسيين]
  - key: rumi
    group: foreign
    name_ar: الرومية
    name_en: Rūmī (Greek)
    forms: [رومية, الرومية, بالرومية, بلغة الروم, بلسان الروم, بلسان الرومية]
  - key: abyssinian
    group: foreign
    name_ar: الحبشية
    name_en: Abyssinian (Ethiopic)
    forms: [حبشية, الحبشية, بالحبشية, بالحبشة, بلسان الحبشة, بلغة الحبشة, بلحن الحبشة, بلسان الحبش, بكلام الحبش, بلسان الحبشي, بلسان الحبشية]
  - key: nabataean
    group: foreign
    name_ar: النبطية
    name_en: Nabataean
    forms: [نبطي, نبطية, النبطية, بالنبطية, بلغة النبط, بلسان النبط, بكلام النبطية, باللغة النبطية, النبط يسمون]
    slip_forms:
      - form: بالنبيطية
        evidence: "«سيناء» (p. 79): «قال: (سيناء) بالنبيطية: الحسن»; the set-aside copy of the same report (p. 58) and Shamela0026097 read «بالنبطية»."
  - key: hebrew
    group: foreign
    name_ar: العبرانية
    name_en: Hebrew
    forms: [عبراني, عبرانية, العبرانية, بالعبرانية, بلغة العبرانية, العبرية, بالعبرية, بلسان العبرية]
    slip_forms:
      - form: بالعنبرانية
        evidence: "«صلوات» (p. 85): «ذكر الجواليقي أنها بالعنبرانية: كنائس اليهود»; the set-aside copy (p. 58) and Shamela0026097 read «بالعبرانيد», both slips of «بالعبرانية»."
      - form: بالعبرانيد
        evidence: "the set-aside copy of «صلوات» (p. 58) and Shamela0026097: «ذكر الجواليقي أنها بالعبرانيد: كنائس اليهود»; the re-typed page 85 reads «بالعنبرانية»."
  - key: syriac
    group: foreign
    name_ar: السريانية
    name_en: Syriac
    forms: [سرياني, سريانية, السريانية, بالسريانية, والسريانية, باللغة السريانية]
    slip_forms:
      - form: أوسريانية
        evidence: "«ربانيون» (p. 60): «وأنما عبرانية أوسريانية» — «أو» run into «سريانية»; all three versions."
  - key: coptic
    group: foreign
    name_ar: القبطية
    name_en: Coptic
    forms: [بالقبطية, بلسان القبط, والقبط يسمون]
  - key: indian
    group: foreign
    name_ar: الهندية
    name_en: Indian
    forms: [بالهندية, بلغة الهند]
  - key: berber
    group: foreign
    name_ar: البربرية
    name_en: Berber
    forms: [بلغة البربر, بلغة بربر]
  - key: zanj
    group: foreign
    name_ar: الزنجية
    name_en: Zanj
    forms: [بالزنجية]
  - key: turkic
    group: foreign
    name_ar: التركية
    name_en: Turkic
    forms: [بلسان الترك]
  - key: hawrani
    group: foreign
    name_ar: الحورانية
    name_en: Ḥawrānī
    forms: [بلسان الحورانية]
  - key: jewish
    group: foreign
    name_ar: لسان اليهود
    name_en: the Jews' speech
    forms: [بلسان اليهود, بلسان يهود يثرب, واليهودية]
  - key: ajam
    group: foreign
    name_ar: لسان العجم
    name_en: the speech of the ʿajam (non-Arabs)
    forms: [بلغة العجم, بلسان العجم]
  - key: maghrib
    group: region
    name_ar: لسان أهل المغرب
