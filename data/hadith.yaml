# Graders whose rulings these are, with the work each ruling comes from (research 21 §3, the evidence pages saved in
# data/raw/fawazahmed0-hadith-api/grade-evidence/).
graders:
  Al-Albani:
    ar: محمد ناصر الدين الألباني
    en: Muḥammad Nāṣir al-Dīn al-Albānī
    works:
      abudawud: صحيح وضعيف سنن أبي داود
      tirmidhi: صحيح وضعيف سنن الترمذي
      nasai: صحيح وضعيف سنن النسائي
      ibnmajah: صحيح وضعيف سنن ابن ماجه
  Shuaib Al Arnaut:
    ar: شعيب الأرنؤوط
    en: Shuʿayb al-Arnaʾūṭ
    works:
      abudawud: تحقيق سنن أبي داود، مع محمد كامل قره بللي (دار الرسالة العالمية، 1430هـ)
      ibnmajah: تحقيق سنن ابن ماجه (دار الرسالة العالمية)
  Zubair Ali Zai:
    ar: زبير علي زئي
    en: Zubair ʿAlī Zaʾī
    # his gradings are published in English, often with references; shown as he wrote them
    as_published: true
    works:
      abudawud: تخريج سنن أبي داود
      tirmidhi: تخريج جامع الترمذي
      nasai: تخريج سنن النسائي
      ibnmajah: تخريج سنن ابن ماجه
  Salim al-Hilali:
    ar: سليم بن عيد الهلالي
    en: Salīm b. ʿĪd al-Hilālī
    works:
      malik: صحيح الموطأ وضعيف الموطأ

# Columns not shown under their names: measured to be another grader's ruling (research 21 §3.2) — the owner decides
# whether they are dropped or kept as a second witness of al-Albānī's ruling with the edition named.
excluded_graders:
  Muhammad Muhyi Al-Din Abdul Hamid: al-Albānī's ruling (96.7% identical to his column); the edition's footnote is unlabelled
  Ahmad Muhammad Shakir: al-Albānī's ruling (96.5% identical)
  Abu Ghuddah: al-Albānī's ruling (95.1% identical)
  Muhammad Fouad Abd al-Baqi: al-Albānī's ruling (94.8% identical; shamela.ws labels the same footnote «[حكم الألباني]»)
  Bashar Awad Maarouf: al-Tirmidhī's own verdict in his text (88.5%), shown as al-Tirmidhī's instead

