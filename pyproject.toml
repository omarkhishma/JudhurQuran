[project]
name = "jadhr-quran-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/arabic-py", "pipeline", "services/api"]

[tool.uv.sources]
jadhr-arabic = { workspace = true }
jadhr-pipeline = { workspace = true }
jadhr-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Arabic text is intentional; the formatter owns line length (SQL strings stay readable)

[tool.pytest.ini_options]
testpaths = ["packages/arabic-py/tests", "pipeline/tests", "services/api/tests"]
