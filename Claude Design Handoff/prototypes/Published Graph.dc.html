<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>html,body{margin:0;padding:0;background:#fffffe}*{box-sizing:border-box}a{color:#2f6ae0;text-decoration:none}a:hover{color:#16161a}input,button{font-family:inherit}button:focus-visible,a:focus-visible{outline:2px solid #2f6ae0;outline-offset:2px}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;font-family:'IBM Plex Sans',sans-serif;color:#16161a;-webkit-font-smoothing:antialiased">
  <div style="height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:#f8f8fa;border-bottom:1px solid #e5e5ea">
    <a href="Jadhr.dc.html" style="display:flex;align-items:center;gap:8px;color:#16161a;flex:none"><div style="width:18px;height:18px;border-radius:5px;background:#a8682c"></div><span style="font-size:14px;font-weight:600">Jadhr</span></a>
    <div style="display:flex;gap:1px;padding:2px;background:#ecedf1;border-radius:9px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto"><sc-for list="{{ nav }}" as="n" hint-placeholder-count="6"><a href="{{ n.href }}" aria-current="{{ n.current }}" style="{{ n.style }}">{{ n.label }}</a></sc-for></div>
    <div style="flex:1"></div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#71717c;white-space:nowrap">jadhr.org/g/{{ slug }}</div>
  </div>
  <div style="padding:10px 16px;border-bottom:1px solid #e5e5ea;background:#fff;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:#71717c"><span>Published graphs</span><sc-for list="{{ list }}" as="g" hint-placeholder-count="2"><button onClick="{{ g.onClick }}" style="{{ g.style }}">{{ g.label }}</button></sc-for><div style="flex:1"></div><a href="Lexicon%20Editor%20v5.dc.html">Publish one from the editor →</a></div>
  <div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0">
    <div style="display:flex;flex-direction:column;min-height:0">
      <div style="padding:20px 26px 12px;display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><div style="font-size:20px;font-weight:600">{{ title }}</div><div style="font-size:12.5px;color:#71717c">{{ byline }}</div></div><div style="font-size:13.5px;color:#4f4f5a;line-height:1.55;max-width:560px">{{ desc }}</div></div>
      <div style="flex:1;margin:0 26px 20px;position:relative;border:1px solid #e5e5ea;border-radius:12px;overflow:hidden;min-height:480px;background:#fff">
        <iframe ref="{{ frameRef }}" src="{{ frameSrc }}" title="Published graph" style="position:absolute;inset:0;width:100%;height:100%;border:none"></iframe>
        <div style="position:absolute;left:10px;bottom:10px;padding:5px 10px;background:#fff;border:1px solid #e5e5ea;border-radius:99px;font-size:11.5px;color:#71717c;pointer-events:none">read-only · the same cards as the editor · double-click a card to unfold · drag to pan</div>
      </div>
    </div>
    <div style="border-left:1px solid #e5e5ea;background:#f8f8fa;padding:20px 18px;display:flex;flex-direction:column;gap:12px">
      <a href="{{ forkHref }}" style="display:block;text-align:center;background:#16161a;border:1px solid #16161a;border-radius:9px;font-size:13px;padding:9px;color:#fff">Fork into my editor</a>
      <div style="display:flex;gap:6px"><button onClick="{{ cite }}" style="flex:1;background:#fff;border:1px solid #e5e5ea;border-radius:9px;font-size:12.5px;padding:8px;cursor:pointer;color:#16161a">Cite</button><button onClick="{{ download }}" style="flex:1;background:#fff;border:1px solid #e5e5ea;border-radius:9px;font-size:12.5px;padding:8px;cursor:pointer;color:#16161a">Download JSON</button></div>
      <div style="height:1px;background:#e5e5ea"></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#71717c">Embed</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.6;padding:9px 10px;border:1px solid #e5e5ea;border-radius:8px;background:#fff;color:#4f4f5a;word-break:break-all">{{ embed }}</div>
      <button onClick="{{ copyEmbed }}" style="align-self:flex-start;background:#fff;border:1px solid #e5e5ea;border-radius:7px;font-size:12px;padding:4px 10px;cursor:pointer">Copy</button>
      <div style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:#4f4f5a"><sc-for list="{{ opts }}" as="o" hint-placeholder-count="3"><label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" checked="{{ o.on }}" onChange="{{ o.onToggle }}" /> {{ o.label }}</label></sc-for></div>
      <div style="height:1px;background:#e5e5ea"></div>
      <div style="font-size:12px;color:#71717c;line-height:1.5">{{ stats }}</div>
      <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#15803d">{{ toast }}</div></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SAMPLE = { slug: 'sample', title: 'Arabic lexicon graph — sample', by: 'Jadhr', updated: '3 Mar 2026', desc: 'The editor\u2019s built-in root families, published as they appear in the graph editor: roots, patterns, words, sentences and a description card, with the classical lexica per sense.', counts: { cards: 24, roots: 6, words: 12 }, forks: 14, cited: 2 };
class Component extends DCLogic {
  state = { m: null, c: null, list: [], cur: null, opts: { entry: true, folded: false, dark: false }, toast: null, sel: null };
  componentDidMount() {
    this.frameRef = React.createRef();
    Promise.all([import('./lexicon-data.js'), import('./jadhr-chrome.js')]).then(([m, c]) => { const pub = m.load(m.KEYS.graphs, []); const list = [SAMPLE].concat(pub); const slug = new URLSearchParams(location.search).get('g'); this.setState({ m, c, list, cur: (list.find(g => g.slug === slug) || SAMPLE).slug }); });
    this.onMsg = e => { const d = e.data || {}; if (d.type === 'jadhr-card') this.setState({ sel: d }); }; window.addEventListener('message', this.onMsg);
  }
  componentWillUnmount() { window.removeEventListener('message', this.onMsg); }
  flash(t) { this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: null }), 1800); }
  post(msg) { const f = this.frameRef.current; if (f && f.contentWindow) f.contentWindow.postMessage(msg, '*'); }
  renderVals() {
    const s = this.state, m = s.m, c = s.c;
    if (!m) return { nav: [], list: [], opts: [] };
    const g = s.list.find(x => x.slug === s.cur) || SAMPLE;
    const nodesOf = g.doc ? g.doc.nodes.filter(n => n.kind !== 'frame') : (g.nodes || []);
    const counts = g.counts || { cards: nodesOf.length, roots: nodesOf.filter(n => n.type === 'root').length, words: nodesOf.filter(n => n.type === 'word').length };
    const embedUrl = 'https://jadhr.org/embed/g/' + g.slug + '?entry=' + (s.opts.entry ? 1 : 0) + '&folded=' + (s.opts.folded ? 1 : 0) + '&theme=' + (s.opts.dark ? 'dark' : 'light');
    const embed = '<iframe src="' + embedUrl + '" width="100%" height="520" style="border:0"></iframe>';
    return {
      nav: c.navModel(''), slug: g.slug, title: g.title, byline: 'by ' + (g.by || 'you') + ' · updated ' + (g.updated || new Date(g.ts || Date.now()).toLocaleDateString()) + ' · ' + counts.cards + ' cards' + (counts.roots ? ' · ' + counts.roots + ' roots' : ''), desc: g.desc || 'Published from the graph editor.',
      list: s.list.map(x => ({ label: x.title, onClick: () => this.setState({ cur: x.slug, sel: null }), style: c.chip(x.slug === s.cur) })),
      frameRef: this.frameRef,
      frameSrc: 'Lexicon%20Editor%20v5.dc.html?view=' + encodeURIComponent(g.slug) + '&embed=1&entry=' + (s.opts.entry ? 1 : 0) + '&folded=' + (s.opts.folded ? 1 : 0) + '&theme=' + (s.opts.dark ? 'dark' : 'light'),
      forkHref: 'Lexicon%20Editor%20v5.dc.html?fork=' + encodeURIComponent(g.slug), embed,
      copyEmbed: () => { try { navigator.clipboard.writeText(embed); } catch (e) {} this.flash('Embed code copied'); },
      cite: () => { try { navigator.clipboard.writeText((g.by || 'You') + '. \u201c' + g.title + '.\u201d Jadhr graph, ' + (g.updated || '2026') + '. https://jadhr.org/g/' + g.slug + '. CC BY-SA 4.0.'); } catch (e) {} this.flash('Citation copied'); },
      download: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(g, null, 2)], { type: 'application/json' })); a.download = g.slug.replace(/\//g, '-') + '.json'; a.click(); },
      opts: [['entry', 'details panel open (click a card)'], ['folded', 'start folded to headlines'], ['dark', 'dark theme']].map(o => ({ label: o[1], on: !!s.opts[o[0]], onToggle: () => { const opts = Object.assign({}, s.opts, { [o[0]]: !s.opts[o[0]] }); this.setState({ opts }); if (o[0] === 'folded') this.post({ type: 'jadhr-fold', folded: opts.folded }); if (o[0] === 'dark') this.post({ type: 'jadhr-theme', dark: opts.dark }); } })),
      stats: 'Forked ' + (g.forks || 0) + ' times · cited in ' + (g.cited || 0) + ' papers · CC BY-SA 4.0 · version history public', toast: s.toast
    };
  }
}
</script>
</body>
</html>
